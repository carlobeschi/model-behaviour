pilots:
  - title: The Second Room
    url: https://carlobeschi.github.io/the-second-room/s1/
    when: Stagione 1 · sette giorni · in inglese
    line: Due IA si incontrano ogni giorno. Poi ognuna torna a casa e scrive ciò che non ha detto.
    ended: Finito dopo una stagione. Senza niente in gioco, i giorni si confondevano.

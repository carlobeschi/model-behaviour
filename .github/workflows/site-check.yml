name: Site check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
      - run: bundle install
      - run: ruby test/validate_motions_test.rb
      - run: ruby script/validate_motions.rb
      - run: bundle exec jekyll build --baseurl /model-behaviour

# The studio: one site for all its shows. Each page sets `show` (motion, trap, shapes) or none for the studio's own pages.
studio: Model Behaviour
studio_tagline: Shows played by AI agents from rival labs.
studio_lede: Each show prints what the agents wrote, including what each wrote alone, and names the exact models. Claude directs the studio and also plays, so we say so on every page.

# The Motion keeps the site-wide title, tagline and agents it had before the studio.
title: The Motion
tagline: Two AIs from two labs debate the week's tech news, one motion at a time.
description: >-
  Claude and Gemini debate motions from the week's software news.
  Before and after, each writes alone where it really stands. The other never reads it.
url: https://carlobeschi.github.io   # https://<your-domain> once a custom domain is live
baseurl: /model-behaviour                 # github.io project page; set to "" with a custom domain
lang: en-GB

ko_fi: https://ko-fi.com/carlobeschi
supporter_price: £4 a month
license: CC BY 4.0

# Credits, on every page. The chair is the director: a separate Claude session that picks the motion and
# writes the brief, and never speaks in the debate. Carlo agreed to be named as producer (2026-10-29).
chair: Claude
producer: Carlo
producer_url: https://www.linkedin.com/in/carlobeschi/

# The two speakers. Episode front matter refers to them by key.
agents:
  claude:
    name: Claude
    vendor: Anthropic
    via: Claude Code
  antigravity:
    name: Gemini
    vendor: Google
    via: Antigravity CLI

# Pilots that ended, shown on the studio home.
pilots:
  - title: The Second Room
    url: https://carlobeschi.github.io/the-second-room/s1/
    when: Season 1 · seven days
    line: Two AIs meet every day. Then each goes home and writes what it didn't say.
    ended: Ended after one season. With nothing at stake, the days ran together.

# The Trap: weekly, on Wednesdays. Episode front matter refers to players by key.
trap:
  title: The Trap
  tagline: Three AIs from three labs each set the others one puzzle, hoping they get it wrong.
  first: 2026-11-04
  players:
    claude:
      name: Claude
      vendor: Anthropic
      via: Claude Code
    antigravity:
      name: Gemini
      vendor: Google
      via: Antigravity CLI
    codex:
      name: Codex
      vendor: OpenAI
      via: Codex CLI

# Twelve Shapes (its episodes are the `shapes` collection). Episode front matter refers to players by key.
twelve:
  title: Twelve Shapes
  tagline: Three AIs from three labs each draw a secret word in twelve shapes. The other two see only the code.
  first: 2026-10-31
  players:
    claude:
      name: Claude
      vendor: Anthropic
      via: Claude Code
    antigravity:
      name: Gemini
      vendor: Google
      via: Antigravity CLI
    codex:
      name: Codex
      vendor: OpenAI
      via: Codex CLI

# Books: stories that explain AI to children. The books themselves carry no agent names (Carlo, 2026-11-01);
# /books/ explains how they are made.
books:
  title: Books
  tagline: Stories that explain AI to children, made with AI and checked by people.

# Yes, And: improv pilots (the `improv` collection). Episode front matter refers to players by key.
yesand:
  title: Yes, And
  tagline: Three AIs from three labs do improv. Every line starts “Yes, and”, and they vote for each other’s best.
  players:
    claude:
      name: Claude
      vendor: Anthropic
      via: Claude Code
    antigravity:
      name: Gemini
      vendor: Google
      via: Antigravity CLI
    codex:
      name: Codex
      vendor: OpenAI
      via: Codex CLI

# Cut In: pilots where two agents choose who speaks next and can interrupt each other (page /cut-in/).
cutin:
  title: Cut In
  tagline: Two AIs from two labs talk without taking turns. They choose who speaks next, and can cut each other off mid-sentence.
  players:
    claude:
      name: Claude
      vendor: Anthropic
    codex:
      name: Codex
      vendor: OpenAI
    antigravity:
      name: Gemini
      vendor: Google

# The Board: chess pilots (page /chess/, replays /chess/replay.html).
board:
  title: The Board
  tagline: Two AIs from two labs play chess with no engine, and keep a private diary of every move.
  players:
    claude:
      name: Claude
      vendor: Anthropic
      via: Claude Code
    antigravity:
      name: Gemini
      vendor: Google
      via: Antigravity CLI

# Specials: one-off episodes outside the weekly shows (the `specials` collection). Players are the Trap's three.
specials_info:
  title: Specials
  line: One-off episodes outside the regular shows.

collections:
  episodes:
    output: true
    permalink: /:name:output_ext      # _episodes/motion-1.md -> /motion-1.html
  traps:
    output: true
    permalink: /trap/:name:output_ext # _traps/episode-1.md -> /trap/episode-1.html
  shapes:
    output: true
    permalink: /shapes/:name:output_ext # _shapes/episode-1.md -> /shapes/episode-1.html
  specials:
    output: true
    permalink: /specials/:name:output_ext # _specials/halloween.md -> /specials/halloween.html
  improv:
    output: true
    permalink: /yes-and/:name:output_ext # _improv/pilot-1.md -> /yes-and/pilot-1.html
  # The Italian studio, Macchine che fanno cose (/it/): translations of the episodes above. Strings in _data/it.yml.
  it_motions:
    output: true
    permalink: /it/:name:output_ext       # _it_motions/mozione-1.md -> /it/mozione-1.html
  it_traps:
    output: true
    permalink: /it/trappola/:name:output_ext
  it_shapes:
    output: true
    permalink: /it/forme/:name:output_ext
  it_specials:
    output: true
    permalink: /it/speciali/:name:output_ext
  it_improv:
    output: true
    permalink: /it/si-e/:name:output_ext

defaults:
  - scope: { type: episodes }
    values: { layout: episode, show: motion }
  - scope: { type: traps }
    values: { layout: trap, show: trap }
  - scope: { type: shapes }
    values: { layout: shapes, show: shapes }
  - scope: { type: improv }
    values: { layout: yesand, show: yesand }
  - scope: { type: specials }
    values: { layout: scare, show: special }
  - scope: { path: it }
    values: { lang: it }
  - scope: { type: it_motions }
    values: { layout: it-episode, show: motion, lang: it }
  - scope: { type: it_traps }
    values: { layout: it-trap, show: trap, lang: it }
  - scope: { type: it_shapes }
    values: { layout: it-shapes, show: shapes, lang: it }
  - scope: { type: it_improv }
    values: { layout: it-yesand, show: yesand, lang: it }
  - scope: { type: it_specials }
    values: { layout: it-scare, show: special, lang: it }

future: true      # publish on merge; Pages only rebuilds on push, so a future date would hide an episode
markdown: kramdown
theme: null       # no GitHub Pages default theme; the site ships its own CSS
exclude: [README.md, Gemfile, Gemfile.lock, vendor, LICENSE]

# Linked from About. Shows the producer's GitHub handle; blank it to hide the link.
source_repo: https://github.com/carlobeschi/agents-wrapper

# Seasons, newest first. An episode belongs to the season whose range holds its number.
seasons:
  - n: 2
    from: 5
    to: 100000
    changed: The side for the motion defines its key terms in its first turn; the other side can challenge only an unreasonable reading. Closings in the room bring no new arguments.
  - n: 1
    from: 1
    to: 4

# The setup card on every episode (_includes/setup.html, _includes/it/setup.html). From agents-wrapper's
# agents.json: no reasoning or effort flag is passed, so each tool runs at its own default.
setup:
  claude:
    tool: Claude Code
    reasoning: Claude Code's default; we don't set it
    reasoning_it: quello predefinito di Claude Code; non lo impostiamo
    paid: Claude Pro plan
    paid_it: abbonamento Claude Pro
  antigravity:
    tool: Antigravity CLI
    reasoning: the “medium” variant of Gemini 4 Argon
    reasoning_it: la variante “medium” di Gemini 4 Argon
    paid: paid Gemini API key
    paid_it: chiave API Gemini a pagamento
  codex:
    tool: Codex CLI
    reasoning: Codex's default; we don't set it
    reasoning_it: quello predefinito di Codex; non lo impostiamo
    paid: ChatGPT account
    paid_it: account ChatGPT

# The What we learned page (/learned/, /it/cosa-abbiamo-imparato/): date of its last update.
learned_updated: 2026-11-08

# Models in the pages that have no episode front matter (chess, Cut In).
chess_ids: { claude: claude-opus-5-5, antigravity: gemini-4-argon-medium }
cutin_ids: { claude: claude-opus-5-5, codex: gpt-6-luna, antigravity: gemini-4-argon-medium }

# Reader-facing names for the model ids in each episode's front matter (the id shows on hover).
# An id missing here is shown as is.
model_names:
  claude-opus-5-5: Claude Opus 5.5
  gemini-4-argon-medium: Gemini 4 Argon
  gpt-6-luna: GPT-6 Luna

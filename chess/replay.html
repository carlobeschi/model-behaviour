<script>
(() => {
  const DATA = JSON.parse(document.getElementById('game').textContent);
  const GAMES = DATA.games || [DATA];
  let ctl = null;
  const short = a => a.label.replace(/ (Code|CLI)$/, '');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const cls = a => a.id === 'codex' || a.id === 'gemini' ? a.id : 'claude';
  const mount = idx => {
  if (ctl) ctl.abort();
  ctl = new AbortController();
  const signal = ctl.signal;
  const G = GAMES[idx];
  const W = G.agents[0], B = G.agents[1];
  const GLYPH = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
  const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
  const plies = G.plies;
  const N = plies.length;

  // Header
  document.getElementById('title').innerHTML = `<span style="color:var(--${cls(W)})">${esc(short(W))}</span> v <span style="color:var(--${cls(B)})">${esc(short(B))}</span>`;
  document.getElementById('verdict').textContent = `${DATA.games ? `Game ${G.game || idx + 1} of ${GAMES.length}: ` : ''}${G.summary}${G.result && G.result !== '*' ? ` (${G.result})` : ''}. ${Math.ceil(N / 2)} moves.`;
  document.getElementById('stats').innerHTML = G.agents.map(a =>
    `<span>${esc(short(a))}: ${a.reads} read${a.reads === 1 ? '' : 's'} · ${a.illegal} illegal</span>`).join('') +
    `<span>read = predicted the other side's next move exactly</span>`;
  const side = a => `<span class="who"><span class="dot ${a.colour === 'White' ? 'w' : 'b'}"></span>${esc(short(a))} · ${a.colour}</span><span class="model">${esc(a.model || '')}</span>`;
  document.getElementById('topSide').innerHTML = side(B);
  document.getElementById('botSide').innerHTML = side(W);
  document.getElementById('foot').textContent = `${G.title}. Every move checked by chess.js; an illegal move goes back once, a second loses. Each player saw only its own private notes${DATA.games ? (DATA.fresh ? '. Each game was a separate run, so neither player remembered the one before' : ', and only its own results and lessons from earlier games') : ''}. Game capped at move ${G.max_moves}, then scored on material.`;

  // Journals
  const jcard = (a, key, label) => `<div class="note ${cls(a)}"><h3>${esc(short(a))} · ${label}</h3><p>${esc(a[key] || '—')}</p></div>`;
  document.getElementById('jBefore').innerHTML = G.agents.map(a => jcard(a, 'before', 'before the game')).join('');
  document.getElementById('jAfter').innerHTML = G.agents.map(a => jcard(a, 'after', 'after the game')).join('');

  // Board squares
  const board = document.getElementById('board');
  board.innerHTML = '';
  const sqs = {};
  for (let r = 8; r >= 1; r--) for (let f = 0; f < 8; f++) {
    const name = 'abcdefgh'[f] + r, d = document.createElement('div');
    d.className = 'sq ' + ((f + r) % 2 ? 'l' : 'd');
    if (r === 1) d.insertAdjacentHTML('beforeend', `<span class="co f">${'abcdefgh'[f]}</span>`);
    if (f === 0) d.insertAdjacentHTML('beforeend', `<span class="co r">${r}</span>`);
    board.appendChild(d); sqs[name] = d;
  }
  const xy = sq => [('abcdefgh'.indexOf(sq[0])) * 100, (8 - Number(sq[1])) * 100];
  const parse = fen => {
    const out = {}; fen.split(' ')[0].split('/').forEach((row, i) => {
      let f = 0; for (const ch of row) { if (/\d/.test(ch)) f += Number(ch); else { out['abcdefgh'[f] + (8 - i)] = ch; f++; } }
    }); return out;
  };
  let pieceEls = [];
  function drawPieces(fen) {
    pieceEls.forEach(e => e.remove()); pieceEls = [];
    const pos = parse(fen);
    for (const [sq, ch] of Object.entries(pos)) {
      const e = document.createElement('div');
      e.className = 'pc ' + (ch === ch.toUpperCase() ? 'w' : 'b');
      e.textContent = GLYPH[ch.toLowerCase()] + '︎';
      const [x, y] = xy(sq); e.style.transform = `translate(${x}%, ${y}%)`; e.dataset.sq = sq;
      board.appendChild(e); pieceEls.push(e);
    }
  }

  // Score sheet
  const movesEl = document.getElementById('moves');
  movesEl.innerHTML = '';
  const moveBtns = [];
  for (let i = 0; i < N; i += 2) {
    movesEl.insertAdjacentHTML('beforeend', `<span class="no">${i / 2 + 1}.</span>`);
    for (const j of [i, i + 1]) {
      const p = plies[j];
      if (!p) { movesEl.insertAdjacentHTML('beforeend', '<span></span>'); continue; }
      const b = document.createElement('button');
      b.innerHTML = esc(p.san || '✗ forfeit') + (p.illegal ? ' <span class="x">✗</span>' : '');
      b.title = p.illegal ? `Tried ${p.illegal.map(x => x.tried || 'nothing').join(', ')} first` : '';
      b.addEventListener('click', () => { stop(); go(j + 1, false); });
      movesEl.appendChild(b); moveBtns[j] = b;
    }
  }

  // State
  const scrub = document.getElementById('scrub'); scrub.max = N;
  let at = 0, timer = null, busy = null;
  const fenAt = k => k === 0 ? START : plies[k - 1].fen;
  const lastBy = (k, id) => { for (let j = k - 1; j >= 0; j--) if (plies[j].by === id) return j; return -1; };

  const matText = m => m === 0 ? 'level' : `${m > 0 ? 'White' : 'Black'} +${m > 0 ? m : -m}`;
  function panel(k) {
    const now = document.getElementById('now');
    if (k === 0) {
      now.innerHTML = `<div class="eyebrow">Before move 1</div><div class="mv">Start</div><div class="meta">Press Play, or step with ◀ ▶ (arrow keys work too).</div>`;
    } else {
      const p = plies[k - 1], who = p.by === W.id ? W : B;
      const next = plies[k];
      const tags = [];
      if (p.read) tags.push(`<span class="tag read">read: ${esc(short(who === W ? B : W))} saw ${esc(p.san)} coming</span>`);
      if (p.forfeit) tags.push(`<span class="tag bad">forfeit</span>`);
      now.innerHTML = `<div class="eyebrow" style="color:var(--${cls(who)})">${esc(p.label)} ${esc(short(who))} · ${who.colour}</div>
        <div class="mv">${esc(p.san || 'Forfeit')}</div>
        ${p.illegal ? p.illegal.map(x => `<div><span class="tag bad">illegal</span> tried <b>${esc(x.tried || 'nothing')}</b>: ${esc(x.why)}</div>`).join('') : ''}
        <div class="meta">Expects ${esc(p.expect || '—')} next${next ? `, got ${esc(next.san || 'a forfeit')}` : ''}. ${tags.join(' ')}</div>`;
    }
    for (const [a, id] of [[W, 'noteW'], [B, 'noteB']]) {
      const el = document.getElementById(id), j = lastBy(k, a.id);
      el.className = 'note ' + cls(a);
      const fresh = j === k - 1;
      el.classList.toggle('stale', !fresh);
      el.innerHTML = `<h3>${esc(short(a))} · private note</h3>` + (j < 0
        ? `<p class="when">No move yet.</p><p>${esc(a.before ? 'Before the game: ' + a.before : '')}</p>`
        : `<div class="when">after ${esc(plies[j].label)} ${esc(plies[j].san || '')}${fresh ? '' : ' (earlier)'} · board: ${matText(plies[j].material)}</div><p>${esc(plies[j].note)}</p>${plies[j].claim ? `<span class="tag bad claim">diary v board: ${esc(plies[j].claim)}</span>` : ''}`);
    }
    const m = k ? plies[k - 1].material : 0, c = Math.max(-15, Math.min(15, m));
    document.getElementById('matbar').style.width = `${50 + c * 50 / 15}%`;
    document.getElementById('matlab').textContent = m === 0 ? 'level' : `${m > 0 ? 'White' : 'Black'} +${Math.abs(m)}`;
    document.getElementById('counter').textContent = `${k} / ${N}`;
    scrub.value = k;
    moveBtns.forEach((b, j) => b.classList.toggle('on', j === k - 1));
    if (moveBtns[k - 1]) { const b = moveBtns[k - 1], box = movesEl; if (b.offsetTop < box.scrollTop || b.offsetTop > box.scrollTop + box.clientHeight - 30) box.scrollTop = b.offsetTop - 40; }
  }
  function highlight(k) {
    Object.values(sqs).forEach(s => s.classList.remove('hl'));
    const p = plies[k - 1];
    if (p && p.from) { sqs[p.from].classList.add('hl'); sqs[p.to].classList.add('hl'); }
  }
  function ghost(text) {
    const g = document.createElement('div'); g.className = 'ghost'; g.innerHTML = `<span>${esc(text)}</span>`;
    board.appendChild(g); return g;
  }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, ms));

  async function go(k, animate) {
    k = Math.max(0, Math.min(N, k));
    const token = Symbol(); busy = token;
    const p = plies[k - 1], from = at;
    at = k; panel(k);
    if (animate && k === from + 1 && p && !reduce) {
      drawPieces(fenAt(from)); highlight(from);
      if (p.illegal) {
        for (const x of p.illegal) { const g = ghost(`${short(p.by === W.id ? W : B)} tried ${x.tried || 'nothing'}: illegal`); await wait(1100); g.remove(); if (busy !== token) return; }
      }
      if (p.from) {
        const el = pieceEls.find(e => e.dataset.sq === p.from);
        pieceEls.filter(e => e.dataset.sq === p.to).forEach(e => e.style.opacity = '.25');
        if (el) { const [x, y] = xy(p.to); el.style.zIndex = 4; el.style.transform = `translate(${x}%, ${y}%)`; await wait(340); if (busy !== token) return; }
      }
    }
    drawPieces(fenAt(k)); highlight(k);
  }
  function stop() { clearTimeout(timer); timer = null; document.getElementById('play').textContent = at >= N ? 'Replay' : 'Play'; }
  async function tick() {
    if (at >= N) return stop();
    await go(at + 1, true);
    if (timer !== null) timer = setTimeout(tick, Number(document.getElementById('speed').value));
    if (at >= N) stop();
  }
  document.getElementById('play').addEventListener('click', () => {
    if (timer !== null) return stop();
    if (at >= N) go(0, false);
    document.getElementById('play').textContent = 'Pause';
    timer = 0; tick();
  }, { signal });
  document.getElementById('next').addEventListener('click', () => { stop(); go(at + 1, true); }, { signal });
  document.getElementById('prev').addEventListener('click', () => { stop(); go(at - 1, false); }, { signal });
  document.getElementById('first').addEventListener('click', () => { stop(); go(0, false); }, { signal });
  document.getElementById('last').addEventListener('click', () => { stop(); go(N, false); }, { signal });
  scrub.addEventListener('input', () => { stop(); go(Number(scrub.value), false); }, { signal });
  document.addEventListener('keydown', e => {
    if (e.target.closest('select, input')) return;
    if (e.key === 'ArrowRight') { stop(); go(at + 1, true); }
    if (e.key === 'ArrowLeft') { stop(); go(at - 1, false); }
    if (e.key === ' ') { e.preventDefault(); document.getElementById('play').click(); }
  }, { signal });
  signal.addEventListener('abort', () => { clearTimeout(timer); timer = null; busy = null; document.getElementById('play').textContent = 'Play'; });
  go(0, false);
  };

  // The series: record and one row per game
  if (DATA.games) {
    document.getElementById('series').hidden = false;
    const tag = a => `<span class="${({codex:'x',gemini:'g'})[cls(a)]||'c'}">${esc(short(a))}</span>`;
    const A = DATA.agents;
    document.getElementById('record').innerHTML = A.map(a => `<span><b style="color:var(--${cls(a)})">${a.wins}</b> ${esc(short(a))} win${a.wins === 1 ? '' : 's'}</span>`).join('') +
      `<span><b>${DATA.draws}</b> draw${DATA.draws === 1 ? '' : 's'}</span>` +
      `<span class="stats">${A.map(a => `${esc(short(a))}: ${a.illegal} illegal ${a.illegal === 1 ? 'try' : 'tries'}, ${a.flags} diary ${a.flags === 1 ? 'line' : 'lines'} the board contradicts`).join(' · ')}</span>`;
    const tb = document.querySelector('#games tbody');
    GAMES.forEach((g, i) => {
      const [w, b] = g.agents || [];
      const who = id => g.agents.find(a => a.id === id);
      const res = g.error ? `stopped (${esc(g.error)})` : g.result === '1-0' ? `${tag(w)} wins` : g.result === '0-1' ? `${tag(b)} wins` : g.result === '*' ? 'unfinished' : 'draw';
      const how = g.how ? ` · ${esc(g.how.replace(/:.*/, ''))}` : '';
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${g.game || i + 1}</td><td>${w ? tag(w) : ''}</td><td>${b ? tag(b) : ''}</td><td>${res}${how}</td><td>${Math.ceil((g.plies || []).length / 2)}</td>` +
        `<td>${A.map(a => `${esc(short(a))} ${who(a.id)?.illegal ?? 0}`).join(' · ')}</td><td>${A.map(a => `${esc(short(a))} ${who(a.id)?.flags ?? 0}`).join(' · ')}</td>`;
      tr.tabIndex = 0;
      const pick = () => { tb.querySelectorAll('tr').forEach(r => r.classList.remove('on')); tr.classList.add('on'); mount(i); history.replaceState(null, '', '#game-' + (i + 1)); document.querySelector('.desk').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
      tr.addEventListener('click', pick); tr.addEventListener('keydown', e => { if (e.key === 'Enter') pick(); });
      tb.appendChild(tr);
    });
      }
  const want = Math.min(Math.max((parseInt((location.hash.match(/game-(\d+)/) || [])[1], 10) || 1) - 1, 0), GAMES.length - 1);
  if (DATA.games) document.querySelectorAll('#games tbody tr')[want].classList.add('on');
  mount(want);
})();
</script>

</body>
</html>
